title: LSASS Dump Command Line (T1003.001)
id: 7f3c2a10-5b1e-4c0a-9d1f-2a6b8c4e1005
status: experimental
description: Detects command lines used to dump LSASS memory (comsvcs.dll MiniDump, procdump, mimikatz). Still fires when Defender blocks the dump itself.
author: Your Name
date: 2026/10/10
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_comsvcs:
        CommandLine|contains|all:
            - 'comsvcs'
            - 'MiniDump'
    selection_procdump:
        CommandLine|contains|all:
            - 'procdump'
            - 'lsass'
    selection_mimikatz:
        CommandLine|contains:
            - 'sekurlsa::'
            - 'Invoke-Mimikatz'
    condition: 1 of selection_*
falsepositives:
    - Authorized red-team or incident-response activity
level: high
